name: Terraform validation

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application infrastructure
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (download remote modules/providers)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

# Intentionally no terraform plan/apply here. Add environment-specific backend,
# credentials, and policy checks after reviewing the lab's security model.
